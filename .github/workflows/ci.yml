name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu
            os: ubuntu-latest
            cmake_args: -G Ninja -DCMAKE_BUILD_TYPE=Release
            build_args: ""
            test_args: ""
          - name: windows
            # windows-latest is VS 2026-only; do not pin "Visual Studio 17 2022".
            os: windows-latest
            cmake_args: -A x64
            build_args: --config Release
            test_args: --build-config Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja
        if: matrix.name == 'ubuntu'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake -S . -B build ${{ matrix.cmake_args }} -DPARCAE_BUILD_TESTS=ON -DPARCAE_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build ${{ matrix.build_args }}

      - name: Test
        run: ctest --test-dir build ${{ matrix.test_args }} --output-on-failure

  # Optional future GPU job (self-hosted). Disabled: CI stays CPU-default.
  # Enable on a runner with Toolkit + GPU via workflow_dispatch when ready.
  cuda-smoke:
    name: cuda-smoke (manual)
    if: false
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure CUDA
        run: >
          cmake -S . -B build-cuda -A x64
          -DPARCAE_BUILD_CUDA=ON
          -DPARCAE_BUILD_TESTS=ON
          -DPARCAE_BUILD_TOOLS=OFF
      - name: Build
        run: cmake --build build-cuda --config Release --target parcae_tests
      - name: Smoke
        run: build-cuda/tests/Release/parcae_tests.exe "[cuda][smoke]" -s
