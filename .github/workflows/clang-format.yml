name: clang-format

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: clang-format-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          set -euo pipefail
          mapfile -t files < <(
            find include tests tools Parcae/Parcae/cuda \
              \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' -o -name '*.cu' -o -name '*.cuh' \) \
              -type f | sort
          )
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No C/C++/CUDA sources found to format-check."
            exit 1
          fi
          clang-format --dry-run --Werror "${files[@]}"
