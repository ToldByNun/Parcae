[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parcae-agent"
version = "0.4.0.dev0"
description = "CMD Liber Primus tool-use agent for Parcae C++ CLIs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[project.scripts]
parcae-agent = "parcae_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["parcae_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "ci: CI-safe agent tests (mock LLM, no network, no live provider keys)",
  "live: optional live provider smoke (requires PARCAE_AGENT_LIVE=1)",
  "ollama: live smoke against local Ollama OpenAI-compatible endpoint",
  "openrouter: live smoke against OpenRouter (needs OPENROUTER_API_KEY)",
]
