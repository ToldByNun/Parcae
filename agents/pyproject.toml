[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parcae-agent"
version = "0.4.0.dev0"
description = "CMD Liber Primus tool-use agent for Parcae C++ CLIs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[project.scripts]
parcae-agent = "parcae_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["parcae_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
